# coturn (STUN/TURN).
#
# TCP 25002/25003만 listen하며 UDP listening은 끈다.
# UDP 27100~27199는 릴레이 allocation 범위다.
#
# 운영 배포 시에는 realm·자격증명·TLS를 실제 값으로 바꾸고,
# 세션마다 서버가 시간제한 자격증명(HMAC)을 발급하도록 한다(T4.2).

services:
  coturn:
    image: coturn/coturn:4.18.0-r0
    network_mode: host
    command: ["-c", "/etc/coturn/turnserver.conf"]
    volumes:
      - ./private/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./private/tls:/etc/coturn/tls:ro
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
